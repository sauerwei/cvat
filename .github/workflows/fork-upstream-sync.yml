name: Fork Upstream Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Base branch in your fork'
        required: true
        default: 'develop'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ github.event.inputs.base_branch || 'develop' }}
      SYNC_BRANCH: bot/upstream-sync
      UPSTREAM_REPO: cvat-ai/cvat
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Ensure upstream remote exists
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          fi

      - name: Sync branch to upstream
        run: |
          set -euo pipefail
          git fetch origin --prune
          git fetch upstream --prune

          git switch -C "$SYNC_BRANCH" "upstream/$BASE_BRANCH"
          git push --force-with-lease origin "$SYNC_BRANCH"

      - name: Create or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PR_NUMBER=$(gh pr list \
            --head "$SYNC_BRANCH" \
            --base "$BASE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [[ -n "$PR_NUMBER" ]]; then
            gh pr edit "$PR_NUMBER" \
              --title "chore: sync upstream/${BASE_BRANCH}" \
              --body "Automated upstream sync from ${UPSTREAM_REPO}:${BASE_BRANCH}."
          else
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "chore: sync upstream/${BASE_BRANCH}" \
              --body "Automated upstream sync from ${UPSTREAM_REPO}:${BASE_BRANCH}."
          fi
