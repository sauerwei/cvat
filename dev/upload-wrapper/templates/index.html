<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Preprocessing</title>
<script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 40px 16px;
    color: #222;
  }

  .card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,.1);
    max-width: 520px;
    margin: 0 auto;
    padding: 32px;
  }

  h1 { margin: 0 0 6px; font-size: 1.4em; color: #222; }
  .subtitle { color: #888; font-size: .9em; margin: 0 0 28px; }

  .field { margin-bottom: 20px; }

  label.field-label {
    display: block;
    font-weight: 600;
    font-size: .88em;
    margin-bottom: 6px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: .04em;
  }

  input[type=file] {
    width: 100%;
    padding: 10px;
    border: 2px dashed #d9d9d9;
    border-radius: 6px;
    font-size: .95em;
    cursor: pointer;
    background: #fafafa;
    transition: border-color .2s;
  }
  input[type=file]:hover { border-color: #1890ff; }

  hr { border: none; border-top: 1px solid #f0f0f0; margin: 22px 0; }

  .section-title {
    font-size: .78em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #bbb;
    margin: 0 0 14px;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .toggle-row input[type=checkbox] {
    width: 18px; height: 18px;
    cursor: pointer;
    accent-color: #1890ff;
    flex-shrink: 0;
  }
  .toggle-row label { font-size: .95em; cursor: pointer; margin: 0; }

  .sub-option {
    margin-left: 28px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .sub-option input[type=checkbox] {
    width: 16px; height: 16px;
    cursor: pointer;
    accent-color: #1890ff;
    flex-shrink: 0;
  }
  .sub-option input[type=number] {
    width: 72px;
    padding: 5px 8px;
    border: 1px solid #d9d9d9;
    border-radius: 5px;
    font-size: .9em;
  }
  .sub-option input[type=number]:disabled { background: #f5f5f5; color: #bbb; }
  .sub-option label { font-size: .9em; color: #555; margin: 0; }

  button[type=submit] {
    width: 100%;
    padding: 12px;
    background: #1890ff;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
    margin-top: 8px;
  }
  button[type=submit]:hover { background: #096dd9; }
  button[type=submit][disabled] { background: #91caff; cursor: not-allowed; }

  #status-box { margin-top: 24px; }
</style>
</head>
<body>
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">
    <h1 style="margin:0;">&#127909; Video Preprocessing</h1>
    <a href="/logout" style="font-size:.8em;color:#aaa;text-decoration:none;" title="Abmelden">Abmelden &#8594;</a>
  </div>
  <p class="subtitle">Redundante Frames entfernen und gefiltertes Video herunterladen.</p>

  <form
    hx-post="/process"
    hx-encoding="multipart/form-data"
    hx-target="#status-box"
    hx-swap="outerHTML"
    hx-disabled-elt="button[type=submit]"
  >
    <div class="field">
      <label class="field-label">Video-Datei</label>
      <input type="file" name="file" accept="video/*" required>
    </div>

    <hr>
    <p class="section-title">Optionen</p>

    <div class="toggle-row">
      <input type="checkbox" name="preprocessing" id="preproc" value="on" checked
             onchange="togglePreproc(this.checked)">
      <label for="preproc">Preprocessing aktiv (redundante Frames entfernen)</label>
    </div>

    <div id="preproc-options">
      <div class="sub-option">
        <input type="checkbox" name="mask_hood_enabled" id="hood_cb" value="on"
               onchange="document.getElementById('hood_val').disabled=!this.checked">
        <label for="hood_cb">Motorhaube maskieren — untere</label>
        <input type="number" id="hood_val" name="mask_hood"
               value="0.15" min="0.05" max="0.50" step="0.01" disabled
               title="Fraktion der Bildhöhe von unten schwärzen (z. B. 0.15 = 15 %)">
        <label>des Bildes schwärzen</label>
      </div>
    </div>

    <button type="submit">Verarbeiten &amp; Download</button>
  </form>

  <div id="status-box"></div>
</div>

<script>
function togglePreproc(on) {
  document.getElementById('preproc-options').style.display = on ? '' : 'none';
  if (!on) {
    document.getElementById('hood_cb').checked = false;
    document.getElementById('hood_val').disabled = true;
  }
}
</script>
</body>
</html>
